<app-spinner [isLoading]="isLoading"></app-spinner>

<section class="content-header">
     <div class="container-fluid">
          <div class="row mb-2">
               <div class="col-sm-6">
                    <h1>Recuperar senha</h1>
               </div>
               <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                         <li class="breadcrumb-item"><a href="#">Home</a></li>
                         <li class="breadcrumb-item active">Recuperar senha</li>
                    </ol>
               </div>
          </div>
     </div>
</section>

<section class="content">
     <div class="container-fluid">
          <div class="card">
               <div class="card-header">
                    <h2></h2>
               </div>

               <div class="container d-flex justify-content-center align-items-center p-5">
                    <form class="w-50" [formGroup]="recoverForm" (ngSubmit)="onSubmit()">
                         <div class="mb-3">
                              <label for="newPassword" class="form-label">Nova senha</label>
                              <input type="password" formControlName="newPassword" class="form-control" id="newPassword">
                         </div>
                         <div class="mb-3">
                              <label for="verifyPassword" class="form-label">Repita a nova senha</label>
                              <input type="password" formControlName="verifyPassword" class="form-control" id="verifyPassword">
                         </div>

                         <div class="text-center">
                              <button type="submit" class="btn btn-primary w-75 mt-2">Criar nova senha</button>
                         </div>
                    </form>
               </div>
          </div>
     </div>
</section>
