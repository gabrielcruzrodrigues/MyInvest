<app-spinner [isLoading]="isLoading"></app-spinner>

<!-- Content Header (Page header) -->
<section class="content-header">
     <div class="container-fluid">
          <div class="row mb-2">
               <div class="col-sm-6">
                    <h1>Criar nova carteira</h1>
               </div>
               <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                         <li class="breadcrumb-item"><a href="#">Home</a></li>
                         <li class="breadcrumb-item"><a href="/purses">Carteiras</a></li>
                         <li class="breadcrumb-item active">Criar nova carteira</li>
                    </ol>
               </div>
          </div>
     </div>
     <!-- /.container-fluid -->
</section>

<!-- Main content -->
<section class="content">
     <!-- Default box -->
     <div class="container-fluid">
          <div class="card">
               <div class="card-header">
                    <h2></h2>
               </div>

               <div class="container d-flex justify-content-center align-items-center p-5">
                    <form class="w-50" [formGroup]="form" (ngSubmit)="onSubmit()">
                         <div class="mb-3">
                              <label for="exampleInputEmail1" class="form-label">Nome da carteira</label>
                              <input type="text" formControlName="name" class="form-control" id="name">
                         </div>
                         <div class="mb-3">
                              <label for="carteiraDescricao" class="form-label">Descrição da carteira</label>
                              <textarea class="form-control" formControlName="description" id="carteiraDescricao" rows="3"
                                   style="resize: none;"></textarea>
                         </div>

                         <div class="text-center">
                              <button type="submit" class="btn btn-primary w-75 mt-2">Criar carteira</button>
                         </div>
                    </form>
               </div>
          </div>
     </div>
</section>
