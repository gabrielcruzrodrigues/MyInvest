<app-spinner [isLoading]="isLoading"></app-spinner>

<!-- Content Header (Page header) -->
<section class="content-header">
     <div class="container-fluid">
          <div class="row mb-2">
               <div class="col-sm-6">
                    <h1>Criar nova perfil SMTP</h1>
               </div>
               <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                         <li class="breadcrumb-item"><a href="#">Home</a></li>
                         <li class="breadcrumb-item active">Criar novo perfil SMTP</li>
                    </ol>
               </div>
          </div>
     </div>
     <!-- /.container-fluid -->
</section>

<!-- Main content -->
<section class="content">
     <!-- Default box -->
     <div class="container-fluid">
          <div class="card">
               <div class="card-header">
                    <h2></h2>
               </div>

               <div class="container d-flex justify-content-center align-items-center p-5">
                    <form class="w-50" [formGroup]="form" (ngSubmit)="onSubmit()">
                         <div class="mb-3">
                              <label for="name" class="form-label">Nome do perfil SMTP</label>
                              <input type="text" formControlName="name" class="form-control" id="name">
                         </div>
                         <div class="mb-3">
                              <label for="smtpClient" class="form-label">Cliente SMTP</label>
                              <input type="text" formControlName="smtpClient" class="form-control" id="smtpClient">
                         </div>
                         <div class="mb-3">
                              <label for="port" class="form-label">Porta SMTP que será utilizada</label>
                              <input type="number" formControlName="port" class="form-control" id="port">
                         </div>
                         <div class="mb-3">
                              <label for="senderEmail" class="form-label">senderEmail</label>
                              <input type="text" formControlName="senderEmail" class="form-control" id="senderEmail">
                         </div>
                         <div class="mb-3">
                              <label for="passwordSenderEmail" class="form-label">passwordSenderEmail</label>
                              <input type="text" formControlName="passwordSenderEmail" class="form-control" id="passwordSenderEmail">
                         </div>

                         <div class="text-center">
                              <button type="submit" class="btn btn-primary w-100 p-2 mt-2">Criar carteira</button>
                         </div>
                    </form>
               </div>
          </div>
     </div>
</section>
